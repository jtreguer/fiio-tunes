[package]
name = "fiio-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
gpod = { version = "0.1.0", path = "../gpod" }
directories = "6.0.0"
lofty = "0.25.4"
rayon = "1.12.0"
rustix = { version = "1.1.5", features = ["fs"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-normalization = "0.1.25"
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
